<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shadows of the Blade | Pantalla de Inicio</title>
  <style>
    :root {
      --primary-gold: #c5a059;
      --gold-glow: rgba(197, 160, 89, 0.5);
      --dark-slate: #0b0f19;
      --glass-panel: rgba(10, 15, 26, 0.78);
      --border-metallic: rgba(197, 160, 89, 0.35);
      --text-silver: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
    }

    body {
      background-color: #030712;
      color: var(--text-silver);
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CONTENEDOR PRINCIPAL CON RELACIÓN DE ASPECTO 16:9 RESPONSIVE */
    .cinema-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 177.78vh; /* 16:9 ratio basado en altura */
      max-height: 56.25vw; /* 16:9 ratio basado en ancho */
      overflow: hidden;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    /* Si la pantalla es más angosta o móvil, llenamos el viewport */
    @media (max-aspect-ratio: 16/9) {
      .cinema-viewport {
        width: 100vw;
        height: 56.25vw;
        min-height: 100vh;
      }
    }

    /* FONDO HIPERREALISTA DEL GUERRERO BAJO LA LLUVIA */
    .hero-background {
      position: absolute;
      inset: 0;
      background-image: url('bg_warrior.jpg');
      background-size: cover;
      background-position: center left;
      z-index: 1;
      filter: brightness(0.92) contrast(1.08);
      transform: scale(1.02);
      transition: transform 12s ease-out;
    }

    /* LIENZO DE LLUVIA, RELÁMPAGOS Y NIEBLA DINÁMICOS */
    #fxCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* DEGRADADO OSCURO A LA DERECHA PARA LEGIBILIDAD DEL MENÚ */
    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 25% 45%, rgba(0, 0, 0, 0) 35%, rgba(3, 7, 18, 0.75) 100%),
                  linear-gradient(to right, rgba(0, 0, 0, 0) 30%, rgba(3, 7, 18, 0.85) 75%, rgba(2, 6, 17, 0.96) 100%);
      z-index: 3;
      pointer-events: none;
    }

    /* BOTÓN DE AUDIO AMBIENTAL */
    .audio-toggle {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 10;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border-metallic);
      color: var(--primary-gold);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s;
    }

    .audio-toggle:hover {
      background: rgba(197, 160, 89, 0.2);
      border-color: var(--primary-gold);
      transform: scale(1.05);
    }

    /* COLUMNA DEL MENÚ A LA DERECHA */
    .menu-container {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 440px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2.5rem 3rem 2.5rem 1rem;
      margin-right: 2rem;
    }

    /* TÍTULO DEL JUEGO */
    .game-branding {
      margin-bottom: 2.8rem;
      text-align: left;
    }

    .game-title {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 4px;
      line-height: 1.1;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 45%, #94a3b8 65%, #c5a059 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.9));
    }

    .game-subtitle {
      font-size: 0.85rem;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: var(--primary-gold);
      margin-top: 0.5rem;
      opacity: 0.9;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .subtitle-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--primary-gold), transparent);
    }

    /* LISTA DE BOTONES VERTICAL */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .menu-item {
      position: relative;
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid rgba(197, 160, 89, 0.25);
      border-left: 3px solid rgba(197, 160, 89, 0.4);
      padding: 0.95rem 1.6rem;
      border-radius: 4px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    .menu-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(197, 160, 89, 0.25), transparent);
      opacity: 0;
      transition: opacity 0.35s;
    }

    .menu-item:hover {
      transform: translateX(-12px);
      border-color: var(--primary-gold);
      border-left: 4px solid var(--primary-gold);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8), 0 0 20px rgba(197, 160, 89, 0.3);
      background: rgba(15, 23, 42, 0.85);
    }

    .menu-item:hover::before {
      opacity: 1;
    }

    .item-text {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e2e8f0;
      transition: color 0.3s, letter-spacing 0.3s;
    }

    .menu-item:hover .item-text {
      color: #fff;
      letter-spacing: 4px;
      text-shadow: 0 0 12px var(--gold-glow);
    }

    .item-icon {
      font-size: 1rem;
      color: var(--primary-gold);
      opacity: 0.4;
      transform: translateX(-6px);
      transition: all 0.35s;
    }

    .menu-item:hover .item-icon {
      opacity: 1;
      transform: translateX(0);
    }

    /* PIE DEL MENÚ */
    .menu-footer {
      margin-top: 2.5rem;
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      opacity: 0.7;
    }

    /* MODAL INTERACTIVO */
    .modal-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-panel {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border-metallic);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 30px var(--gold-glow);
      border-radius: 8px;
      width: 100%;
      max-width: 520px;
      padding: 2rem;
      animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.92) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(197, 160, 89, 0.25);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--primary-gold);
      text-transform: uppercase;
    }

    .btn-close {
      background: transparent;
      border: 1px solid rgba(197, 160, 89, 0.3);
      color: var(--text-silver);
      width: 32px;
      height: 32px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-close:hover {
      background: rgba(197, 160, 89, 0.2);
      border-color: var(--primary-gold);
    }

    .modal-body {
      color: var(--text-silver);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .modal-btn-action {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #c5a059, #8c6d32);
      border: 1px solid #ffd700;
      color: #0b0f19;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(197, 160, 89, 0.4);
      transition: all 0.2s;
    }

    .modal-btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(197, 160, 89, 0.6);
    }

    /* ADAPTABILIDAD MÓVIL (RESPONSIVE) */
    @media (max-width: 820px) {
      .cinema-viewport {
        justify-content: center;
        align-items: flex-end;
      }
      .menu-container {
        margin-right: 0;
        padding: 1.5rem;
        max-width: 100%;
        background: linear-gradient(0deg, rgba(3, 7, 18, 0.95) 45%, rgba(3, 7, 18, 0.4) 85%, transparent 100%);
      }
      .game-branding {
        margin-bottom: 1.5rem;
        text-align: center;
      }
      .game-title {
        font-size: 1.9rem;
      }
      .subtitle-line {
        display: none;
      }
      .audio-toggle {
        top: 1rem;
        left: 1rem;
        padding: 0.4rem 0.8rem;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <div class="cinema-viewport">
    <!-- IMAGEN HIPERREALISTA DEL GUERRERO -->
    <div class="hero-background" id="heroBg"></div>

    <!-- CANVAS DE LLUVIA, RELÁMPAGOS Y NIEBLA DINÁMICOS -->
    <canvas id="fxCanvas"></canvas>

    <!-- VIÑETA CINEMATOGRÁFICA -->
    <div class="vignette-overlay"></div>

    <!-- BOTÓN DE SONIDO AMBIENTAL -->
    <button class="audio-toggle" id="audioToggle">
      <span id="audioIcon">🌧️</span> SONIDO ATMOSFÉRICO
    </button>

    <!-- MENÚ VERTICAL A LA DERECHA -->
    <div class="menu-container">
      <div class="game-branding">
        <h1 class="game-title">SHADOWS<br>OF THE BLADE</h1>
        <div class="game-subtitle">
          <span>CRÓNICAS DEL CABALLERO</span>
          <div class="subtitle-line"></div>
        </div>
      </div>

      <nav class="menu-list">
        <div class="menu-item" data-action="new-game">
          <span class="item-text">NUEVA PARTIDA</span>
          <span class="item-icon">⚔️</span>
        </div>

        <div class="menu-item" data-action="load-game">
          <span class="item-text">PARTIDAS GUARDADAS</span>
          <span class="item-icon">📜</span>
        </div>

        <div class="menu-item" data-action="options">
          <span class="item-text">OPCIONES</span>
          <span class="item-icon">⚙️</span>
        </div>

        <div class="menu-item" data-action="store">
          <span class="item-text">TIENDA</span>
          <span class="item-icon">💎</span>
        </div>
      </nav>

      <div class="menu-footer">
        VERSIÓN 1.0.4 &bull; DESPLEGADO EN AWS EC2 NGINX
      </div>
    </div>

    <!-- VENTANA MODAL INTERACTIVA -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-panel">
        <div class="modal-header">
          <h2 class="modal-title" id="modalTitle">TÍTULO</h2>
          <button class="btn-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Contenido dinámico -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==================================================
    // AUDIO SINTETIZADO HIPERREALISTA (Lluvia, Trueno, Espada)
    // ==================================================
    let audioCtx = null;
    let rainNode = null;
    let soundActive = false;

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleAtmosphericAudio() {
      initAudioContext();
      soundActive = !soundActive;
      const icon = document.getElementById('audioIcon');

      if (soundActive) {
        icon.textContent = '🔊';
        startRainSound();
        triggerThunderSound();
      } else {
        icon.textContent = '🌧️';
        stopRainSound();
      }
    }

    // Ruido continuo de lluvia filtrado
    function startRainSound() {
      if (rainNode || !audioCtx) return;
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 850;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 2.5);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      whiteNoise.start();

      rainNode = { source: whiteNoise, gain: gain };
    }

    function stopRainSound() {
      if (!rainNode || !audioCtx) return;
      rainNode.gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
      setTimeout(() => {
        if (rainNode) {
          rainNode.source.stop();
          rainNode = null;
        }
      }, 1200);
    }

    // Sonido de trueno retumbante
    function triggerThunderSound() {
      if (!soundActive || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(80, now);
        osc.frequency.exponentialRampToValueAtTime(25, now + 3.0);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 3.0);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 3.0);
      } catch (e) {}
    }

    // Sonido metálico de espada al pasar el cursor
    function playBladeHover() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1400, now);
        osc.frequency.exponentialRampToValueAtTime(2800, now + 0.12);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      } catch (e) {}
    }

    // Sonido de impacto profundo al hacer clic
    function playStoneClick() {
      initAudioContext();
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.25);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {}
    }

    document.getElementById('audioToggle').addEventListener('click', toggleAtmosphericAudio);

    // ==================================================
    // SISTEMA DE LLUVIA, RELÁMPAGOS Y GOTAS (CANVAS 60FPS)
    // ==================================================
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      width = canvas.width = rect.width;
      height = canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Gotas de lluvia
    const RAIN_COUNT = 240;
    const raindrops = [];
    for (let i = 0; i < RAIN_COUNT; i++) {
      raindrops.push({
        x: Math.random() * 2000 - 400,
        y: Math.random() * 1200,
        length: Math.random() * 25 + 15,
        speed: Math.random() * 14 + 18,
        angle: 0.18, // inclinación del viento
        opacity: Math.random() * 0.4 + 0.25
      });
    }

    // Salpicaduras en la roca
    const splashes = [];
    function createSplash(x, y) {
      if (splashes.length > 50) return;
      splashes.push({
        x: x,
        y: y,
        r: 1,
        maxR: Math.random() * 4 + 2,
        opacity: 0.6
      });
    }

    // Sistema de Relámpagos dinámicos
    let lightningFlash = 0;
    let nextLightningFrame = Math.floor(Math.random() * 260) + 180;

    function updateAndRenderFX() {
      ctx.clearRect(0, 0, width, height);

      // Efecto de relámpago que ilumina toda la escena
      if (nextLightningFrame <= 0) {
        lightningFlash = 0.85;
        triggerThunderSound();
        nextLightningFrame = Math.floor(Math.random() * 380) + 240;
      } else {
        nextLightningFrame--;
      }

      if (lightningFlash > 0) {
        ctx.fillStyle = `rgba(224, 242, 254, ${lightningFlash * 0.45})`;
        ctx.fillRect(0, 0, width, height);
        lightningFlash *= 0.88;
        if (lightningFlash < 0.02) lightningFlash = 0;
      }

      // Dibujar lluvia inclinada
      ctx.strokeStyle = '#bae6fd';
      ctx.lineWidth = 1.2;

      for (let i = 0; i < raindrops.length; i++) {
        const d = raindrops[i];
        ctx.globalAlpha = d.opacity;
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x + d.length * d.angle, d.y + d.length);
        ctx.stroke();

        d.x += d.speed * d.angle;
        d.y += d.speed;

        // Si toca la base o roca, generar salpicadura
        if (d.y > height * 0.75 && Math.random() < 0.05) {
          createSplash(d.x, d.y);
        }

        if (d.y > height + 20) {
          d.y = -30;
          d.x = Math.random() * (width + 400) - 200;
        }
      }

      // Dibujar salpicaduras
      ctx.strokeStyle = '#e0f2fe';
      ctx.lineWidth = 1;
      for (let i = 0; i < splashes.length; i++) {
        const s = splashes[i];
        ctx.globalAlpha = s.opacity;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.stroke();

        s.r += 0.4;
        s.opacity -= 0.04;
        if (s.opacity <= 0) {
          splashes.splice(i, 1);
          i--;
        }
      }

      ctx.globalAlpha = 1.0;
      requestAnimationFrame(updateAndRenderFX);
    }
    requestAnimationFrame(updateAndRenderFX);

    // ==================================================
    // INTERACTIVIDAD DEL MENÚ LATERAL Y MODALES
    // ==================================================
    const menuItems = document.querySelectorAll('.menu-item');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalClose = document.getElementById('modalClose');

    menuItems.forEach(item => {
      item.addEventListener('mouseenter', () => {
        playBladeHover();
      });

      item.addEventListener('click', () => {
        playStoneClick();
        const action = item.getAttribute('data-action');
        openModal(action);
      });
    });

    modalClose.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
      }
    });

    function openModal(action) {
      if (action === 'new-game') {
        modalTitle.textContent = '⚔️ NUEVA PARTIDA';
        modalBody.innerHTML = `
          <p style="margin-bottom: 1.25rem;">Elige el nivel de desafío para adentrarte en las tierras olvidadas:</p>
          <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            <label style="display: flex; align-items: center; gap: 0.75rem; background: rgba(11,15,25,0.7); padding: 0.75rem; border-radius: 6px; border: 1px solid rgba(197,160,89,0.3); cursor: pointer;">
              <input type="radio" name="diff" checked style="accent-color: #c5a059;">
              <div><strong>Caballero Errante (Normal)</strong><div style="font-size: 0.78rem; color: #94a3b8;">Equilibrio entre combate táctico y exploración.</div></div>
            </label>
            <label style="display: flex; align-items: center; gap: 0.75rem; background: rgba(11,15,25,0.7); padding: 0.75rem; border-radius: 6px; border: 1px solid rgba(197,160,89,0.3); cursor: pointer;">
              <input type="radio" name="diff" style="accent-color: #c5a059;">
              <div><strong>Señor de las Sombras (Difícil)</strong><div style="font-size: 0.78rem; color: #94a3b8;">Enemigos implacables y menor regeneración de vigor.</div></div>
            </label>
            <label style="display: flex; align-items: center; gap: 0.75rem; background: rgba(11,15,25,0.7); padding: 0.75rem; border-radius: 6px; border: 1px solid rgba(239,68,68,0.4); cursor: pointer;">
              <input type="radio" name="diff" style="accent-color: #ef4444;">
              <div><strong style="color: #f87171;">Muerte Permanente (Pesadilla)</strong><div style="font-size: 0.78rem; color: #94a3b8;">La muerte borra permanentemente tu archivo de guardado.</div></div>
            </label>
          </div>
