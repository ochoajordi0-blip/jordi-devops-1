<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Bird VIP | Tienda de Paga & Skins Nginx</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(15, 23, 42, 0.9);
      --accent: #38bdf8;
      --accent-gold: #fbbf24;
      --accent-emerald: #10b981;
      --accent-ruby: #f43f5e;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #090d16 100%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      overflow-x: hidden;
    }

    /* BARRA SUPERIOR CON SALDO DE GEMAS Y ACCESO A TIENDA */
    .top-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 430px;
      margin-bottom: 0.5rem;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 0.5rem 0.85rem;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
    }

    .gem-pill {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 0.88rem;
      color: #fda4af;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .gem-pill:hover {
      transform: scale(1.04);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-shop {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }

    .btn-shop:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.6);
    }

    .btn-icon {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      padding: 0.35rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* CONTENEDOR DEL JUEGO */
    .game-wrapper {
      position: relative;
      width: 100%;
      max-width: 410px;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 35px rgba(56, 189, 248, 0.25);
      background: #000;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #38bdf8;
    }

    /* CONTROLES / PIE */
    .footer-bar {
      margin-top: 0.5rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .kbd {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      font-weight: 700;
    }

    /* MODAL DE TIENDA VIP */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .shop-modal {
      background: #0f172a;
      border: 2px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 1.25rem;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.2);
      animation: modalSlide 0.25s ease-out;
    }

    @keyframes modalSlide {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 0.75rem;
    }

    .shop-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .close-btn {
      background: #1e293b;
      border: none;
      color: #94a3b8;
      font-size: 1.25rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      background: #334155;
      color: #fff;
    }

    .shop-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .shop-tab {
      flex: 1;
      padding: 0.5rem;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.82rem;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
    }

    .shop-tab.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .items-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .shop-item-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      transition: all 0.2s;
    }

    .shop-item-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
      background: #24334a;
    }

    .item-preview {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      border: 1px solid #334155;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-weight: 800;
      font-size: 0.95rem;
      color: #f8fafc;
      margin-bottom: 0.2rem;
    }

    .item-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .btn-buy {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      border: none;
      color: #fff;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }

    .btn-buy:hover {
      opacity: 0.9;
    }

    .btn-equipped {
      background: #10b981;
      cursor: default;
    }

    .btn-equip {
      background: #334155;
      color: #38bdf8;
      border: 1px solid #38bdf8;
    }

    /* MODAL DE CHECKOUT SIMULADO */
    .checkout-modal {
      background: #0f172a;
      border: 2px solid #fbbf24;
      border-radius: 20px;
      max-width: 380px;
      width: 100%;
      padding: 1.5rem;
      text-align: center;
      animation: modalSlide 0.25s ease-out;
    }

    .checkout-badge {
      display: inline-block;
      background: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 0.75rem;
      border: 1px solid rgba(251, 191, 36, 0.4);
    }
  </style>
</head>
<body>

  <!-- BARRA DE ACCIONES SUPERIOR -->
  <div class="top-navbar">
    <div class="gem-pill" id="gemCounterPill" title="Tus Gemas (Haz clic para comprar más)">
      <span>💎</span>
      <span id="gemCountText">25</span>
    </div>

    <div class="nav-actions">
      <button class="btn-shop" id="openShopBtn">
        <span>🛒</span> TIENDA VIP
      </button>
      <button class="btn-icon" id="audioToggle">
        <span id="audioIcon">🔊</span>
      </button>
    </div>
  </div>

  <!-- CONTENEDOR DEL LIENZO -->
  <div class="game-wrapper" id="gameContainer">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
  </div>

  <!-- PIE DE PÁGINA -->
  <div class="footer-bar">
    <div><span class="kbd">ESPACIO</span> o <span class="kbd">TAP / CLIC</span> para aletear &bull; <span class="kbd">R</span> reiniciar</div>
    <div style="color: #64748b;">Flappy Bird VIP Monetizado &bull; Nginx Server EC2 AWS</div>
  </div>

  <!-- MODAL DE TIENDA VIP -->
  <div class="modal-overlay" id="shopModalOverlay">
    <div class="shop-modal">
      <div class="shop-header">
        <div class="shop-title">
          <span>🛒</span> Tienda VIP & Monedas
        </div>
        <button class="close-btn" id="closeShopBtn">&times;</button>
      </div>

      <div class="shop-tabs">
        <button class="shop-tab active" data-tab="skins">Skins VIP</button>
        <button class="shop-tab" data-tab="powerups">Poderes</button>
        <button class="shop-tab" data-tab="gems">Comprar Gemas</button>
      </div>

      <!-- SECCIÓN SKINS -->
      <div class="items-grid" id="skinsList"></div>

      <!-- SECCIÓN POWER-UPS -->
      <div class="items-grid" id="powerupsList" style="display: none;"></div>

      <!-- SECCIÓN COMPRA DE GEMAS -->
      <div class="items-grid" id="gemsList" style="display: none;"></div>
    </div>
  </div>

  <!-- MODAL DE CHECKOUT / PAGO -->
  <div class="modal-overlay" id="checkoutOverlay">
    <div class="checkout-modal">
      <div class="checkout-badge">PASARELA DE PAGO SEGURA</div>
      <h3 id="checkoutItemName" style="color: #fff; margin-bottom: 0.5rem; font-size: 1.25rem;">Pack de Gemas</h3>
      <p id="checkoutItemDesc" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.25rem;">Recibe 100 Gemas instantáneamente para tu cuenta.</p>
      
      <div style="background: #1e293b; border-radius: 12px; padding: 1rem; margin-bottom: 1.25rem; border: 1px solid #334155; text-align: left;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.85rem;">
          <span style="color: #94a3b8;">Total a pagar:</span>
          <span id="checkoutPrice" style="color: #4ade80; font-weight: 800; font-size: 1.1rem;">$0.99 USD</span>
        </div>
        <div style="font-size: 0.75rem; color: #64748b;">
          💳 Simulación de tarjeta &bull; Aprobación instantánea
        </div>
      </div>

      <div style="display: flex; gap: 0.75rem;">
        <button id="cancelCheckoutBtn" style="flex: 1; padding: 0.65rem; background: #334155; border: none; color: #fff; border-radius: 10px; font-weight: 700; cursor: pointer;">Cancelar</button>
        <button id="confirmCheckoutBtn" style="flex: 2; padding: 0.65rem; background: linear-gradient(135deg, #10b981, #059669); border: none; color: #fff; border-radius: 10px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);">Pagar Ahora</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ESTADO PERSISTENTE (ECONOMÍA Y COMPRAS)
    // ==========================================
    let gems = parseInt(localStorage.getItem('flappy_gems') || '25', 10);
    let activeSkin = localStorage.getItem('flappy_active_skin') || 'classic';
    let ownedSkins = JSON.parse(localStorage.getItem('flappy_owned_skins') || '["classic"]');
    let shieldsOwned = parseInt(localStorage.getItem('flappy_shields') || '1', 10);
    let revivesOwned = parseInt(localStorage.getItem('flappy_revives') || '1', 10);
    let highScore = parseInt(localStorage.getItem('flappy_vip_high') || '0', 10);

    function saveEconomy() {
      localStorage.setItem('flappy_gems', gems);
      localStorage.setItem('flappy_active_skin', activeSkin);
      localStorage.setItem('flappy_owned_skins', JSON.stringify(ownedSkins));
      localStorage.setItem('flappy_shields', shieldsOwned);
      localStorage.setItem('flappy_revives', revivesOwned);
      document.getElementById('gemCountText').textContent = gems;
    }
    saveEconomy();

    // Catálogo de Skins
    const SKINS_DATA = [
      { id: 'classic', name: 'Pájaro Clásico 🐤', icon: '🐤', desc: 'El intrépido original con plumas doradas.', price: 0, realPrice: '$0.00' },
      { id: 'mecha', name: 'Cyber-Mecha 🤖', icon: '🤖', desc: 'Armadura de titanio, visor neón y propulsor de plasma azul.', price: 50, realPrice: '$0.99' },
      { id: 'phoenix', name: 'Fénix de Fuego 🔥', icon: '🔥', desc: 'Ave mítica que arde con llamaradas y estela incandescente.', price: 120, realPrice: '$1.99' },
      { id: 'king', name: 'Rey Pájaro Real 👑', icon: '👑', desc: 'Corona dorada con rubíes y capa de la realeza.', price: 200, realPrice: '$2.99' }
    ];

    // Catálogo de Power-ups
    const POWERUPS_DATA = [
      { id: 'shield', name: 'Escudo de Fuerza 🛡️', icon: '🛡️', desc: 'Protege contra 1 impacto mortal de tubería.', price: 10, realPrice: '$0.49' },
      { id: 'revive', name: 'Ficha de Resurrección ❤️', icon: '❤️', desc: 'Permite revivir de inmediato al morir y continuar tu récord.', price: 15, realPrice: '$0.79' }
    ];

    // Paquetes de Gemas
    const GEMS_PACKS = [
      { id: 'pack_100', name: 'Bolsa de 100 💎', icon: '💎', desc: 'Ideal para comprar el Mecha Bird o revivir partidas.', gems: 100, priceUsd: '$0.99 USD' },
      { id: 'pack_350', name: 'Cofre de 350 💎 (Popular)', icon: '💎', desc: 'Desbloquea el Fénix de Fuego y escudos de sobra.', gems: 350, priceUsd: '$2.49 USD' },
      { id: 'pack_1000', name: 'Bóveda de 1000 💎 (VIP)', icon: '👑', desc: 'Acceso total a todas las skins y poderes ilimitados.', gems: 1000, priceUsd: '$4.99 USD' }
    ];

    // ==========================================
    // AUDIO SINTETIZADO (Web Audio API)
    // ==========================================
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    const audioBtn = document.getElementById('audioToggle');
    const audioIcon = document.getElementById('audioIcon');
    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      soundEnabled = !soundEnabled;
      audioIcon.textContent = soundEnabled ? '🔊' : '🔇';
    });

    function playSound(type) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        if (type === 'flap') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(750, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'score') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(784, now);
          osc.frequency.setValueAtTime(1046, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.22);
        } else if (type === 'gem') {
          // Tintineo de gema preciosa
          [1318, 1760, 2093].forEach((f, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + i * 0.04);
            gain.gain.setValueAtTime(0.2, now + i * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.04 + 0.25);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now + i * 0.04); osc.stop(now + i * 0.04 + 0.25);
          });
        } else if (type === 'shield_break') {
          // Rompimiento de escudo eléctrico
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.3);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'kaching') {
          // Sonido de caja registradora / compra exitosa
          [987, 1318].forEach((f, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + i * 0.09);
            gain.gain.setValueAtTime(0.3, now + i * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.09 + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now + i * 0.09); osc.stop(now + i * 0.09 + 0.4);
          });
        } else if (type === 'crash') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(35, now + 0.35);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.35);
        }
      } catch (e) {}
    }

    // ==========================================
    // INTERFAZ DE TIENDA Y MODALES
    // ==========================================
    const shopModalOverlay = document.getElementById('shopModalOverlay');
    const checkoutOverlay = document.getElementById('checkoutOverlay');
    const openShopBtn = document.getElementById('openShopBtn');
    const closeShopBtn = document.getElementById('closeShopBtn');
    const gemCounterPill = document.getElementById('gemCounterPill');

    openShopBtn.addEventListener('click', () => { initAudio(); openShop('skins'); });
    gemCounterPill.addEventListener('click', () => { initAudio(); openShop('gems'); });
    closeShopBtn.addEventListener('click', () => { shopModalOverlay.classList.remove('active'); });

    function openShop(defaultTab = 'skins') {
      renderShopTabs();
      switchTab(defaultTab);
      shopModalOverlay.classList.add('active');
    }

    // Pestañas de la tienda
    document.querySelectorAll('.shop-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        switchTab(tab.getAttribute('data-tab'));
      });
    });

    function switchTab(tabName) {
      document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
      document.getElementById('skinsList').style.display = tabName === 'skins' ? 'flex' : 'none';
      document.getElementById('powerupsList').style.display = tabName === 'powerups' ? 'flex' : 'none';
      document.getElementById('gemsList').style.display = tabName === 'gems' ? 'flex' : 'none';
      renderShopTabs();
    }

    function renderShopTabs() {
      // 1. Render Skins
      const skinsList = document.getElementById('skinsList');
      skinsList.innerHTML = SKINS_DATA.map(skin => {
        const isOwned = ownedSkins.includes(skin.id);
        const isEquipped = activeSkin === skin.id;

        let actionBtn = '';
        if (isEquipped) {
          actionBtn = `<button class="btn-buy btn-equipped">✓ En uso</button>`;
        } else if (isOwned) {
          actionBtn = `<button class="btn-buy btn-equip" onclick="equipSkin('${skin.id}')">Equipar</button>`;
        } else {
          actionBtn = `<button class="btn-buy" onclick="buySkin('${skin.id}')">💎 ${skin.price}</button>`;
        }

        return `
          <div class="shop-item-card">
            <div class="item-preview">${skin.icon}</div>
            <div class="item-info">
              <div class="item-name">${skin.name}</div>
              <div class="item-desc">${skin.desc}</div>
            </div>
            ${actionBtn}
          </div>
        `;
      }).join('');

      // 2. Render Powerups
      const powerupsList = document.getElementById('powerupsList');
      powerupsList.innerHTML = POWERUPS_DATA.map(p => {
        const count = p.id === 'shield' ? shieldsOwned : revivesOwned;
        return `
          <div class="shop-item-card">
            <div class="item-preview">${p.icon}</div>
            <div class="item-info">
              <div class="item-name">${p.name} <span style="color:#fbbf24; font-size:0.8rem;">(Tienes: ${count})</span></div>
              <div class="item-desc">${p.desc}</div>
            </div>
            <button class="btn-buy" onclick="buyPowerup('${p.id}')">💎 ${p.price}</button>
          </div>
        `;
      }).join('');

      // 3. Render Gem Packs
      const gemsList = document.getElementById('gemsList');
      gemsList.innerHTML = GEMS_PACKS.map(g => `
        <div class="shop-item-card" style="border-color: rgba(251, 191, 36, 0.4);">
          <div class="item-preview" style="background: rgba(251, 191, 36, 0.15);">${g.icon}</div>
          <div class="item-info">
            <div class="item-name" style="color: #fde047;">${g.name}</div>
            <div class="item-desc">${g.desc}</div>

            ${g.priceUsd}
          </button>
        </div>
      `).join('');
    }

    window.equipSkin = function(skinId) {
      activeSkin = skinId;
      saveEconomy();
      renderShopTabs();
    };

    window.buySkin = function(skinId) {
      const skin = SKINS_DATA.find(s => s.id === skinId);
      if (gems >= skin.price) {
        gems -= skin.price;
        ownedSkins.push(skinId);
        activeSkin = skinId;
        saveEconomy();
        playSound('kaching');
        renderShopTabs();
      } else {
        alert('¡No tienes suficientes Gemas! Compra un paquete de gemas para desbloquear esta Skin.');
        switchTab('gems');
      }
    };

    window.buyPowerup = function(powerupId) {
      const p = POWERUPS_DATA.find(item => item.id === powerupId);
      if (gems >= p.price) {
        gems -= p.price;
        if (powerupId === 'shield') shieldsOwned++;
        else if (powerupId === 'revive') revivesOwned++;
        saveEconomy();
        playSound('kaching');
        renderShopTabs();
      } else {
        alert('Gemas insuficientes. Consigue más en la pestaña de Gemas.');
        switchTab('gems');
      }
    };

    // Checkout Simulado
    let pendingPack = null;
    window.openCheckout = function(packId) {
      pendingPack = GEMS_PACKS.find(p => p.id === packId);
      document.getElementById('checkoutItemName').textContent = pendingPack.name;
      document.getElementById('checkoutItemDesc').textContent = pendingPack.desc;
      document.getElementById('checkoutPrice').textContent = pendingPack.priceUsd;
      checkoutOverlay.classList.add('active');
    };

    document.getElementById('cancelCheckoutBtn').addEventListener('click', () => {

    });

    document.getElementById('confirmCheckoutBtn').addEventListener('click', () => {
      if (pendingPack) {
        gems += pendingPack.gems;
        saveEconomy();
        playSound('kaching');
        checkoutOverlay.classList.remove('active');
        alert(`¡Pago completado con éxito! Se han añadido +${pendingPack.gems} Gemas a tu cuenta.`);
        renderShopTabs();
      }
    });

    // ==========================================
    // MOTOR DE JUEGO (CANVAS 60FPS)
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const STATES = { TITLE: 0, PLAYING: 1, GAMEOVER: 2 };
    let gameState = STATES.TITLE;
    let score = 0;
    let hasShieldActive = false;
    let frames = 0;
    let groundOffset = 0;

    // Botones interactivos en pantalla sobre Canvas
    const uiButtons = {
      reviveRect: { x: 60, y: 390, w: 280, h: 48 },
      retryRect: { x: 60, y: 448, w: 280, h: 42 }
    };

    // Pájaro con skins
    const bird = {
      x: 85,
      y: 260,
      radius: 15,
      vy: 0,
      gravity: 0.38,
      jumpImpulse: -7.5,
      rotation: 0,
      wingCycle: 0,
      invulnerableTimer: 0,

      reset() {
        this.x = 85;
        this.y = 260;
        this.vy = 0;
        this.rotation = 0;
        this.invulnerableTimer = 0;
        // Si el jugador tiene escudos comprados, activamos uno para la partida
        if (shieldsOwned > 0) {
          hasShieldActive = true;
          shieldsOwned--;
          saveEconomy();
        } else {
          hasShieldActive = false;
        }
      },

      flap() {
        this.vy = this.jumpImpulse;
        playSound('flap');
        // Partículas según la skin activa
        if (activeSkin === 'phoenix') {
          spawnFireEmbers(this.x - 14, this.y + 4, 8);
        } else if (activeSkin === 'mecha') {
          spawnPlasmaSparks(this.x - 14, this.y + 4, 6);
        } else {
          spawnFeathers(this.x - 12, this.y + 4, 4);
        }
      },

      update() {
        if (this.invulnerableTimer > 0) this.invulnerableTimer--;

        if (gameState === STATES.TITLE) {
          this.wingCycle += 0.08;
          this.y = 260 + Math.sin(this.wingCycle) * 8;
          this.rotation = 0;
          return;
        }

        if (gameState === STATES.PLAYING) {
          this.vy += this.gravity;
          this.y += this.vy;

          const targetRot = Math.min(Math.PI * 0.45, Math.max(-Math.PI * 0.25, (this.vy / 10) * 0.8));
          this.rotation += (targetRot - this.rotation) * 0.15;
          this.wingCycle += (this.vy < 0 ? 0.35 : 0.12);

          const groundY = canvas.height - 85 - this.radius;
          if (this.y >= groundY) {
            this.y = groundY;
            triggerDeath();
          }

          if (this.y - this.radius <= 0) {
            this.y = this.radius;
            this.vy = 0;
          }
        }
      },

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Efecto de parpadeo si está invulnerable (post-revive)
        if (this.invulnerableTimer > 0 && Math.floor(this.invulnerableTimer / 4) % 2 === 0) {
          ctx.globalAlpha = 0.4;
        }

        // DIBUJAR SEGÚN LA SKIN SELECCIONADA
        if (activeSkin === 'mecha') {
          // SKIN: CYBER-MECHA
          // Propulsor de plasma
          ctx.fillStyle = '#06b6d4';
          ctx.beginPath();
          ctx.ellipse(-14, 2, 7, 4, 0, 0, Math.PI * 2);
          ctx.fill();

          // Cuerpo de titanio
          ctx.fillStyle = '#64748b';
          ctx.beginPath();
          ctx.ellipse(0, 0, 17, 14, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Visor Neón Cyan
          ctx.fillStyle = '#22d3ee';
          ctx.shadowColor = '#22d3ee';
          ctx.shadowBlur = 10;
          ctx.fillRect(4, -6, 12, 6);
          ctx.shadowBlur = 0;

          // Pico metálico
          ctx.fillStyle = '#94a3b8';
          ctx.beginPath();
          ctx.moveTo(12, -2); ctx.lineTo(24, 2); ctx.lineTo(12, 6);
          ctx.closePath(); ctx.fill();

        } else if (activeSkin === 'phoenix') {
          // SKIN: FÉNIX DE FUEGO
          // Llamas de cola
          ctx.fillStyle = '#f97316';
          ctx.beginPath();
          ctx.moveTo(-10, 0); ctx.lineTo(-26, -6); ctx.lineTo(-24, 6); ctx.closePath();
          ctx.fill();

          // Cuerpo ígneo
          const fireGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, 18);
          fireGrad.addColorStop(0, '#fef08a');
          fireGrad.addColorStop(0.5, '#f97316');
          fireGrad.addColorStop(1, '#dc2626');
          ctx.fillStyle = fireGrad;
          ctx.beginPath();
          ctx.ellipse(0, 0, 17, 14, 0, 0, Math.PI * 2);
          ctx.fill();

          // Ojo llameante
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(10, -5, 4, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#7f1d1d';
          ctx.beginPath();
          ctx.arc(11, -5, 2, 0, Math.PI * 2); ctx.fill();

          // Pico dorado
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.moveTo(12, -3); ctx.lineTo(24, 1); ctx.lineTo(12, 6);
          ctx.closePath(); ctx.fill();

        } else if (activeSkin === 'king') {
          // SKIN: REY PÁJARO
          // Cuerpo dorado
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.ellipse(0, 0, 17, 14, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ca8a04';
          ctx.stroke();

          // Corona Real
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.moveTo(-8, -14);
          ctx.lineTo(-4, -8); ctx.lineTo(0, -16);
          ctx.lineTo(4, -8); ctx.lineTo(8, -14);
          ctx.lineTo(8, -8); ctx.lineTo(-8, -8);
          ctx.closePath();
          ctx.fill();
          // Rubíes de la corona
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(-1, -12, 3, 3);

          // Ojo
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(9, -5, 4.5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#0f172a';
          ctx.beginPath(); ctx.arc(10, -5, 2.5, 0, Math.PI * 2); ctx.fill();

          // Pico
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.moveTo(12, -2); ctx.lineTo(23, 2); ctx.lineTo(12, 6);
          ctx.closePath(); ctx.fill();

        } else {
          // SKIN: CLÁSICO
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.ellipse(0, 0, 17, 14, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ca8a04';
          ctx.stroke();

          // Ala
          const wingFlap = Math.sin(this.wingCycle) * 6;
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.ellipse(-6, 2 + wingFlap, 8, 5, -0.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Ojo
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(9, -5, 5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#0f172a';
          ctx.beginPath(); ctx.arc(10.5, -5, 2.5, 0, Math.PI * 2); ctx.fill();

          // Pico
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.moveTo(12, -2); ctx.lineTo(23, 2); ctx.lineTo(12, 6);
          ctx.closePath(); ctx.fill();
        }

        // DIBUJAR ESCUDO DE FUERZA (Si está activo)
        if (hasShieldActive) {
          ctx.strokeStyle = '#38bdf8';
          ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(0, 0, 24, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        ctx.restore();
      }
    };

    // Partículas
    const particles = [];
    function spawnFeathers(x, y, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 2,
          size: 3, color: '#facc15', life: 1.0, decay: 0.03
        });
      }
    }
    function spawnFireEmbers(x, y, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y, vx: -Math.random() * 3 - 1, vy: (Math.random() - 0.5) * 3,
          size: Math.random() * 4 + 2, color: '#f97316', life: 1.0, decay: 0.04
        });
      }
    }
    function spawnPlasmaSparks(x, y, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y, vx: -Math.random() * 4 - 1, vy: (Math.random() - 0.5) * 2,
          size: 3, color: '#22d3ee', life: 1.0, decay: 0.05
        });
      }
    }

    // Tuberías y Gemas flotantes
    const pipes = {
      items: [],
      gap: 135,
      width: 58,
      speed: 2.3,

      reset() {
        this.items = [];
      },

      update() {
        if (gameState !== STATES.PLAYING) return;

        if (frames % 110 === 0) {
          const minH = 70;
          const maxH = canvas.height - 85 - this.gap - minH;
          const topH = Math.floor(Math.random() * (maxH - minH + 1)) + minH;
          
          // 65% de probabilidad de que aparezca una gema recolectable en el espacio
          const hasGem = Math.random() < 0.65;
          const gemY = topH + this.gap / 2;

          this.items.push({
            x: canvas.width,
            top: topH,
            passed: false,
            gem: hasGem ? { y: gemY, collected: false } : null
          });
        }

        for (let i = 0; i < this.items.length; i++) {
          const p = this.items[i];
          p.x -= this.speed;

          const bottomY = p.top + this.gap;

          // RECOLECCIÓN DE GEMA
          if (p.gem && !p.gem.collected) {
            const dist = Math.hypot(bird.x - (p.x + this.width / 2), bird.y - p.gem.y);
            if (dist < bird.radius + 14) {
              p.gem.collected = true;
              gems++;
              saveEconomy();
              playSound('gem');
              // Destellos de gema
              for (let k = 0; k < 6; k++) {
                particles.push({
                  x: bird.x, y: bird.y,
                  vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
                  size: 3, color: '#f43f5e', life: 1.0, decay: 0.04
                });
              }
            }
          }

          // COLISIÓN CON TUBERÍA
          if (bird.invulnerableTimer <= 0) {
            const birdLeft = bird.x - bird.radius + 3;
            const birdRight = bird.x + bird.radius - 3;
            const birdTop = bird.y - bird.radius + 3;
            const birdBottom = bird.y + bird.radius - 3;

            const pipeLeft = p.x;
            const pipeRight = p.x + this.width;

            if (birdRight > pipeLeft && birdLeft < pipeRight) {
              if (birdTop < p.top || birdBottom > bottomY) {
                if (hasShieldActive) {
                  // El escudo salva la vida
                  hasShieldActive = false;
                  bird.invulnerableTimer = 60; // 1 segundo de gracia
                  playSound('shield_break');
                  // Rompimiento de escudo visual
                  for (let s = 0; s < 12; s++) {
                    particles.push({
                      x: bird.x, y: bird.y,
                      vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
                      size: 4, color: '#38bdf8', life: 1.0, decay: 0.03
                    });
                  }
                } else {
                  triggerDeath();
                  return;
                }
              }
            }
          }

          // PUNTO
          if (!p.passed && p.x + this.width < bird.x) {
            p.passed = true;
            score++;
            playSound('score');
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('flappy_vip_high', highScore);
            }
          }

          // Eliminar de memoria
          if (p.x + this.width < -10) {
            this.items.splice(i, 1);
            i--;
          }
        }
      },

      draw() {
        for (const p of this.items) {
          // Tubo superior e inferior
          this.drawPipe(p.x, 0, this.width, p.top, true);
          const bottomY = p.top + this.gap;
          const bottomH = canvas.height - 85 - bottomY;
          this.drawPipe(p.x, bottomY, this.width, bottomH, false);

          // DIBUJAR GEMA FLOTANTE
          if (p.gem && !p.gem.collected) {
            ctx.save();
            ctx.translate(p.x + this.width / 2, p.gem.y);
            // Rotación y brillo
            const bob = Math.sin(frames * 0.1) * 3;
            ctx.translate(0, bob);
            ctx.fillStyle = '#f43f5e';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -9); ctx.lineTo(8, -2); ctx.lineTo(0, 10); ctx.lineTo(-8, -2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }
        }
      },

      drawPipe(x, y, w, h, isTop) {
        if (h <= 0) return;
        const grad = ctx.createLinearGradient(x, 0, x + w, 0);
        grad.addColorStop(0, '#15803d');
        grad.addColorStop(0.3, '#22c55e');
        grad.addColorStop(0.6, '#86efac');
        grad.addColorStop(1, '#14532d');

        ctx.fillStyle = grad;
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = '#052e16';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);

        const capH = 24;
        const capY = isTop ? y + h - capH : y;
        ctx.fillRect(x - 3, capY, w + 6, capH);
        ctx.strokeRect(x - 3, capY, w + 6, capH);
      }
    };

    function triggerDeath() {
      if (gameState !== STATES.PLAYING) return;
      gameState = STATES.GAMEOVER;
      playSound('crash');
    }

    function reviveGame() {
      if (revivesOwned > 0 || gems >= 10) {
        if (revivesOwned > 0) {
          revivesOwned--;
        } else {
          gems -= 10;
        }
        saveEconomy();
        playSound('kaching');
        // Reanimar al pájaro en el centro y darle invulnerabilidad
        bird.y = 260;
        bird.vy = -3;
        bird.invulnerableTimer = 120; // 2 segundos invulnerable
        hasShieldActive = true;
        // Limpiar tuberías inmediatas que causaron la muerte
        pipes.items = pipes.items.filter(p => p.x > bird.x + 80);
        gameState = STATES.PLAYING;
      } else {
        alert('Necesitas 1 Ficha de Resurrección o 10 Gemas para revivir. ¡Visita la Tienda VIP!');
        openShop('powerups');
      }
    }

    // INTERACCIÓN Y CLICS
    function handleGameClick(clientX, clientY) {
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (clientX - rect.left) * scaleX;
      const y = (clientY - rect.top) * scaleY;

      if (gameState === STATES.TITLE) {
        gameState = STATES.PLAYING;
        bird.reset();
        pipes.reset();
        score = 0;
        bird.flap();
      } else if (gameState === STATES.PLAYING) {
        bird.flap();
      } else if (gameState === STATES.GAMEOVER) {
        // Clic en botón REVIVIR
        const rBtn = uiButtons.reviveRect;
        if (x >= rBtn.x && x <= rBtn.x + rBtn.w && y >= rBtn.y && y <= rBtn.y + rBtn.h) {
          reviveGame();
          return;
        }

        // Clic en botón REINTENTAR
        const retBtn = uiButtons.retryRect;
        if (x >= retBtn.x && x <= retBtn.x + retBtn.w && y >= retBtn.y && y <= retBtn.y + retBtn.h) {
          bird.reset();
          pipes.reset();
          score = 0;
          gameState = STATES.PLAYING;
          bird.flap();
          return;
        }
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handleGameClick(e.clientX, e.clientY);
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        initAudio();
        if (gameState === STATES.TITLE) {
          gameState = STATES.PLAYING;
          bird.reset();
          pipes.reset();
          score = 0;
          bird.flap();
        } else if (gameState === STATES.PLAYING) {
          bird.flap();
        } else if (gameState === STATES.GAMEOVER) {
          // Por defecto reiniciar
          bird.reset();
          pipes.reset();
          score = 0;
          gameState = STATES.PLAYING;
          bird.flap();
        }
      } else if (e.code === 'KeyR') {
        bird.reset();
        pipes.reset();
        score = 0;
        gameState = STATES.TITLE;
      }
    });

    // DIBUJAR UI / HUD Y MODAL DE GAME OVER
    function drawHUD() {
      if (gameState === STATES.PLAYING) {
        // Marcador central
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 5;
        ctx.font = '900 44px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeText(score, canvas.width / 2, 70);
        ctx.fillText(score, canvas.width / 2, 70);

        // Indicador de Escudo Activo
        if (hasShieldActive) {
          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 13px -apple-system, sans-serif';
          ctx.fillText('🛡️ ESCUDO ACTIVO', canvas.width / 2, 95);
        }
      } else if (gameState === STATES.TITLE) {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 5;
        ctx.font = '900 36px -apple-system, sans-serif';
        ctx.strokeText('FLAPPY BIRD VIP', canvas.width / 2, 160);
        ctx.fillText('FLAPPY BIRD VIP', canvas.width / 2, 160);

        ctx.font = '700 13px -apple-system, sans-serif';
        ctx.fillStyle = '#fbbf24';
        ctx.fillText('TIENDA DE SKINS & PODERES', canvas.width / 2, 185);

        const promptY = 340 + Math.sin(frames * 0.08) * 4;
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 4;
        ctx.font = 'bold 18px -apple-system, sans-serif';
        ctx.strokeText('¡Haz clic para iniciar!', canvas.width / 2, promptY);
        ctx.fillText('¡Haz clic para iniciar!', canvas.width / 2, promptY);
      } else if (gameState === STATES.GAMEOVER) {
        // PANEL DE GAME OVER CON BOTÓN DE REVIVIR
        ctx.save();
        ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
        ctx.beginPath();
        ctx.roundRect(35, 120, 330, 390, 20);
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ef4444';
        ctx.font = '900 28px -apple-system, sans-serif';
        ctx.fillText('¡HAS CAÍDO!', canvas.width / 2, 165);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '600 18px -apple-system, sans-serif';
        ctx.fillText(`Puntuación: ${score}`, canvas.width / 2, 210);

        ctx.fillStyle = '#fbbf24';
        ctx.fillText(`Récord: ${highScore}`, canvas.width / 2, 245);

        ctx.fillStyle = '#fda4af';
        ctx.font = 'bold 14px -apple-system, sans-serif';
        ctx.fillText(`Tus Gemas: 💎 ${gems}`, canvas.width / 2, 280);

        // BOTÓN REVIVIR (VIP CONTINUAR)
        const rBtn = uiButtons.reviveRect;
        const revCan = revivesOwned > 0 ? `❤️ Usar Ficha (${revivesOwned})` : '💎 Revivir por 10 Gemas';
        const gradRevive = ctx.createLinearGradient(rBtn.x, rBtn.y, rBtn.x + rBtn.w, rBtn.y + rBtn.h);
        gradRevive.addColorStop(0, '#f43f5e');
        gradRevive.addColorStop(1, '#e11d48');
        ctx.fillStyle = gradRevive;
        ctx.beginPath();
        ctx.roundRect(rBtn.x, rBtn.y, rBtn.w, rBtn.h, 12);
        ctx.fill();
        ctx.strokeStyle = '#fda4af';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px -apple-system, sans-serif';
        ctx.fillText(revCan, canvas.width / 2, rBtn.y + 30);

        // BOTÓN REINTENTAR NORMAL
        const retBtn = uiButtons.retryRect;
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.roundRect(retBtn.x, retBtn.y, retBtn.w, retBtn.h, 10);
        ctx.fill();
        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 14px -apple-system, sans-serif';
        ctx.fillText('Nueva Partida (Reiniciar)', canvas.width / 2, retBtn.y + 26);
        ctx.restore();
      }
    }

    // BUCLE PRINCIPAL
    function mainLoop() {
      // Cielo
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height - 85);
      sky.addColorStop(0, '#0284c7');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height - 85);

      // Nubes
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.beginPath();
      ctx.arc(80, 80, 30, 0, Math.PI * 2); ctx.arc(120, 75, 40, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.arc(280, 110, 35, 0, Math.PI * 2); ctx.arc(320, 105, 45, 0, Math.PI * 2); ctx.fill();

      // Tuberías
      pipes.update();
      pipes.draw();

      // Suelo
      if (gameState === STATES.PLAYING || gameState === STATES.TITLE) groundOffset += 2.3;
      const gy = canvas.height - 85;
      ctx.fillStyle = '#713f12';
      ctx.fillRect(0, gy, canvas.width, 85);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(0, gy, canvas.width, 14);

      // Partículas
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1.0;
        if (p.life <= 0) { particles.splice(i, 1); i--; }
      }

      // Pájaro
      bird.update();
      bird.draw();

      // HUD
      drawHUD();

      frames++;
      requestAnimationFrame(mainLoop);
    }

    requestAnimationFrame(mainLoop);
  </script>
</body>
</html>
